name: MONEY_AGENT FreeCAD 6587 port helper

on:
  push:
    branches:
      - money-agent-6587-port-integration
    paths:
      - .github/workflows/money-agent-6587-port.yml
      - tools/money_agent_6587_port.py
      - tools/money_agent_6587_restore_format.py

permissions:
  contents: write

jobs:
  apply-port:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply deterministic ordinate-dimension port
        run: python3 tools/money_agent_6587_port.py
      - name: Restore upstream file formatting
        run: python3 tools/money_agent_6587_restore_format.py
      - name: Validate patch whitespace
        run: |
          git config core.whitespace cr-at-eol
          git diff --check
      - name: Commit generated source changes
        shell: bash
        run: |
          if git diff --quiet && git diff --cached --quiet; then
            echo "No source changes produced"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/Mod/TechDraw
          git commit -m "TechDraw: port ordinate dimensions to current main" -m "Assisted-by: GPT-5.6 Sol"
          git push origin HEAD:${GITHUB_REF_NAME}
